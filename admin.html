<style>
:root{--red:#A8141C;--gold:#E3B23C;--ink:#1C1B1A;--brown:#3B2416;--brown2:#5A3B28;--cream:#FBF4E4;--line:#E8D9B5;--green:#2E6B3A;--orange:#9A4A00}
*{box-sizing:border-box}
body{margin:0;font-family:'Lato',system-ui,sans-serif;color:var(--brown);background:#F6F1E6;font-size:16px;line-height:1.5}
a{color:var(--red)}
button,input,select{font:inherit}
h1,h2{font-family:'Courgette',cursive;font-weight:400;margin:0;color:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:999px;border:0;font-weight:900;cursor:pointer;text-decoration:none}
.btn-red{background:var(--red);color:#fff}
.btn-line{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn-ghost{background:transparent;color:#fff;border:2px solid var(--gold)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
.field textarea{border-radius:12px;border:1px solid #C9B58A;padding:10px 14px;background:#fff;color:var(--brown);resize:vertical}
.field input,.field select{min-height:48px;border-radius:12px;border:1px solid #C9B58A;padding:0 14px;background:#fff;color:var(--brown)}

/* Login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--ink)}
.login form{width:100%;max-width:380px;background:var(--cream);border-radius:22px;padding:32px;display:flex;flex-direction:column;gap:14px;text-align:center;border:3px solid var(--gold)}
.login img{width:140px;height:140px;margin:0 auto;mix-blend-mode:multiply}
.login .hint{font-size:14px;color:var(--brown2);margin:0}

/* App */
header{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;border-bottom:4px solid var(--gold)}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px}
header .t{display:flex;align-items:center;gap:12px;margin:0}
header .t img{width:44px;height:44px;border-radius:50%;background:#fff}
header .t span{font-family:'Courgette',cursive;font-size:22px}
header .t small{display:block;font-family:'Lato',sans-serif;font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
header .acts{display:flex;gap:8px;flex-wrap:wrap}
header .btn{min-height:40px;padding:0 14px;font-size:14px}
.tabs{display:flex;gap:6px;margin:18px 0}
.tab{flex:1 1 0;min-height:48px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:900;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:#fff;border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.stat b{display:block;font-size:26px;color:var(--ink)}
.stat span{font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:flex-end}
.tools .field{flex:1 1 220px}
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:16px;border:1px solid var(--line);padding:14px}
.card-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.sw{width:48px;height:48px;border-radius:10px;flex:0 0 auto}
.card-h .n{flex:1 1 auto;min-width:0}
.card-h .n b{display:block;color:var(--ink)}
.card-h .n span{font-size:14px;color:var(--brown2)}
.pill{padding:3px 10px;border-radius:999px;color:#fff;font-size:13px;font-weight:900;white-space:nowrap}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;background:var(--cream)}
.row .s{flex:1 1 auto;font-weight:900;color:var(--ink)}
.row .c{min-width:70px;text-align:center;font-weight:900}
.row .c small{display:block;font-size:12px;font-weight:700;color:var(--brown2)}
.pm{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:#fff;color:var(--ink);font-size:22px;font-weight:900;cursor:pointer;line-height:1}
.pm:disabled{opacity:.35;cursor:not-allowed}
.rent{margin:2px 0 6px;padding:10px;border-radius:10px;border:2px solid var(--red);background:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;font-weight:700}
.rent input{min-height:44px;border-radius:8px;border:1px solid #C9B58A;padding:0 10px;font:inherit}
.rent-acts{display:flex;gap:8px;flex-wrap:wrap;width:100%}

var MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'],MOISL=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'],JOURS=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'],JOURSL=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
function noon(d){d=new Date(d);d.setHours(12,0,0,0);return d;}
function iso(d){d=noon(d);var m=d.getMonth()+1,j=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(j<10?'0':'')+j;}
function parse(s){var p=String(s).slice(0,10).split('-');return new Date(+p[0],+p[1]-1,+p[2],12);}
function addDays(n,from){var d=noon(from?parse(from):new Date());d.setDate(d.getDate()+n);return iso(d);}
function today(){return iso(new Date());}
function fmt(s){var d=parse(s);return JOURS[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()];}
function fmtLong(s){var d=parse(s);return JOURSL[d.getDay()]+' '+d.getDate()+' '+MOISL[d.getMonth()];}
function fmtShort(s){var d=parse(s);return d.getDate()+' '+MOIS[d.getMonth()];}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var token=null;try{token=localStorage.getItem(KT);}catch(e){}
function H(){return {'apikey':KEY,'Content-Type':'application/json'};}
function fail(r){return r.text().then(function(t){var m=t;try{m=JSON.parse(t).message||t;}catch(e){}throw new Error(m);});}
function get(path){return fetch(SB+'/rest/v1/'+path,{headers:H()}).then(function(r){return r.ok?r.json():fail(r);});}
function rpc(n,a){return fetch(SB+'/rest/v1/rpc/'+n,{method:'POST',headers:H(),body:JSON.stringify(a||{})}).then(function(r){if(!r.ok)return fail(r);return r.text().then(function(t){return t?JSON.parse(t):null;});});}
function arpc(n,a){a=a||{};a.p_token=token;return rpc(n,a);}
var C={};
var ready=get('loge_contenu?select=cle,valeur').then(function(L){L.forEach(function(x){C[x.cle]=x.valeur;});}).catch(function(e){console.warn('LDC',e);});
function rz(file,max,q){return new Promise(function(ok,ko){var r=new FileReader();r.onerror=ko;r.onload=function(){var im=new Image();im.onerror=ko;im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){ok({blob:b,url:URL.createObjectURL(b)});},'image/jpeg',q);};im.src=r.result;};r.readAsDataURL(file);});}
function favs(){try{return JSON.parse(localStorage.getItem(KF)||'[]');}catch(e){return [];}}
function saveFavs(L){try{localStorage.setItem(KF,JSON.stringify(L));}catch(e){}}
return {
SB:SB,DAYS:DAYS,ready:ready,rpc:rpc,arpc:arpc,
token:function(){return token;},
setToken:function(t){token=t;try{t?localStorage.setItem(KT,t):localStorage.removeItem(KT);}catch(e){}},
info:function(){var o=JSON.parse(JSON.stringify(INFO)),i=C.info||{};for(var k in i){o[k]=i[k];}return o;},
theme:function(){return (C.theme&&C.theme.nom)||'aucun';},
setContenu:function(k,v){C[k]=v;},
img:function(k){return PHOTOS[k]||'';},
photo:function(p,thumb){if(!p)return '';if(p.indexOf('p:')===0)return PHOTOS[p.slice(2)]||'';if(p.indexOf('data:')===0||p.indexOf('http')===0)return p;return BUCKET+(thumb?p.replace(/\.jpg$/,'_t.jpg'):p);},
/* envoi d'une photo de costume (Espace Claire) : renvoie le chemin enregistré */
uploadPhoto:function(file){
  return Promise.all([rz(file,1200,.78),rz(file,360,.72)]).then(function(im){
    return fetch(SB+'/functions/v1/loge-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,n:1})}).then(function(r){return r.ok?r.json():fail(r);}).then(function(j){
      var u=j.urls[0];
      var put=function(url,b){return fetch(SB+'/storage/v1'+url,{method:'PUT',headers:{'Content-Type':'image/jpeg','x-upsert':'true'},body:b}).then(function(r){if(!r.ok)return fail(r);});};
      return Promise.all([put(u.full,im[0].blob),put(u.thumb,im[1].blob)]).then(function(){return u.path;});
    });
  });
},
favoris:favs,
isFav:function(id){return favs().some(function(f){return f.id===id;});},
toggleFav:function(c){var L=favs(),i=-1;L.forEach(function(f,k){if(f.id===c.id)i=k;});if(i>=0)L.splice(i,1);else L.push({id:c.id,nom:c.nom,photo:c.photo||''});saveFavs(L);return i<0;},
clearFavs:function(){saveFavs([]);},
free:function(c){return (c.tailles||[]).reduce(function(a,s){return a+(+s.f||0);},0);},
total:function(c){return (c.tailles||[]).reduce(function(a,s){return a+(+s.n||0);},0);},
nextBack:function(c){var l=(c.tailles||[]).filter(function(s){return s.r;}).map(function(s){return s.r;}).sort();return l[0]||'';},
esc:esc,iso:iso,today:today,fmt:fmt,fmtLong:fmtLong,fmtShort:fmtShort,addDays:addDays,parse:parse,MOIS:MOIS,MOISL:MOISL,JOURSL:JOURSL
};
})();

var A={etat:'chargement',tab:'rdv',rdvMode:'avenir',locMode:'encours',open:{},costs:{},q:'',qres:null,annee:String(new Date().getFullYear()),ld:{},U:[],R:null,L:null,ST:null};

function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none';},2800);}
function eur(n){return (Math.round((+n||0)*100)/100).toLocaleString('fr-FR',{maximumFractionDigits:2})+' €';}
function oops(e){console.warn(e);var m=String(e&&e.message||e);if(m.indexOf('session')>=0){LDC.setToken(null);A.etat='login';render();toast('Session expirée, reconnectez-vous');return;}toast('Erreur : vérifiez la connexion internet');}
function busy(el,on){if(el){el.disabled=on;el.style.opacity=on?.6:1;}}
function uLabel(id){for(var i=0;i<A.U.length;i++){if(A.U[i].id===id)return A.U[i].label;}return id||'';}
function slug(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'divers';}
function tel(t){var n=String(t||'').replace(/[^0-9+]/g,'');return n;}
function sms(num,txt){location.href='sms:'+tel(num)+'?&body='+encodeURIComponent(txt);}
function sig(){return 'Claire – La Loge de Claire'+(LDC.info().tel?' – '+LDC.info().tel:'');}

/* ---------- démarrage ---------- */
function start(){
  var t=LDC.token();
  (t?LDC.rpc('loge_session_ok',{p_token:t}):Promise.resolve(false)).then(function(ok){
    if(ok){A.etat='ok';return LDC.ready.then(loadAll);}
    LDC.setToken(null);return LDC.rpc('loge_etat').then(function(e){A.etat=e&&e.configure?'login':'init';render();});
  }).catch(function(e){console.warn(e);$('app').innerHTML='<div class="login"><form><img src="'+LOGO+'" alt=""><h1>Espace Claire</h1><p class="hint">Connexion impossible. Vérifiez internet puis rechargez la page.</p></form></div>';});
}
function loadAll(){return Promise.all([loadU(),loadR(),loadL()]).then(render).catch(oops);}
function loadU(){return LDC.arpc('loge_admin_univers').then(function(u){A.U=u||[];});}
function loadR(){return LDC.arpc('loge_rdv_liste',{p_du:LDC.addDays(-30)}).then(function(r){A.R=r||[];});}
function loadL(){return LDC.arpc('loge_locations_liste',{p_mode:A.locMode==='rendues'?'rendues':'encours'}).then(function(l){A.L=l||[];});}

  var T=[['rdv','Rendez-vous'+(aconf?' <span class="bdg">'+aconf+'</span>':'')],['loc','Locations'+(late?' <span class="bdg">'+late+'</span>':'')],['stock','Costumes'],['stats','Statistiques'],['info','Infos boutique'],['mdp','Mot de passe']];

function importBuild(){

  var cell=function(r,k){return M[k]==null?'':String(r[M[k]]==null?'':r[M[k]]).trim();};
  IM.rows.forEach(function(r){
    var nom=cell(r,'nom');if(!nom)return;
    var ul=cell(r,'univers'),uid=ul?slug(ul):def,ulab=ul||uLabel(def);
    var known=A.U.filter(function(u){return u.label.toLowerCase()===ul.toLowerCase()||u.id===uid;})[0];if(known){uid=known.id;ulab=known.label;}
    var ref=cell(r,'ref'),key=ref?'r:'+ref:'n:'+nom.toLowerCase()+'|'+uid;

  case 'cost-save':editSync();var ee=$('e-err'),er2=function(x){ee.textContent=x;ee.hidden=false;};
    if(!CE.nom)return er2('Indiquez le nom du costume.');if(!CE.tailles.length)return er2('Ajoutez au moins une taille.');
    busy(b,true);var go=function(){return LDC.arpc('loge_costume_enregistrer',{p:{id:CE.id,ref:CE.ref,nom:CE.nom,univers:CE.univers,descr:CE.descr,photo:CE.photo||null,prix:CE.prix,tailles:CE.tailles.map(function(t){return {s:t.s,n:t.n};})}});};
    var nu=CE.univers==='__new'?prompt('Nom du nouvel univers :'):null;
    (nu?LDC.arpc('loge_univers_enregistrer',{p:{id:slug(nu),label:nu.trim(),ordre:100}}).then(function(){CE.univers=slug(nu);}):Promise.resolve()).then(function(){if(CE.univers==='__new')throw new Error('univers');return go();})
    .then(function(){var u=CE.univers;$('modal').remove();CE=null;delete A.costs[u];A.qres=null;A.q='';A.open[u]=true;toast('Costume enregistré ✓');return loadU().then(function(){return loadUnivers(u);});}).catch(function(x){busy(b,false);if(String(x.message)==='univers')return er2('Choisissez un univers.');oops(x);});break;
  case 'cost-del':if(!confirm('Supprimer « '+CE.nom+' » ? Il disparaît du site (l’historique des locations est conservé).'))return;
    LDC.arpc('loge_costumes_retirer',{p_ids:[CE.id]}).then(function(){var u=CE.univers;$('modal').remove();CE=null;delete A.costs[u];toast('Costume supprimé');return loadU().then(function(){return loadUnivers(u);});}).catch(oops);break;
  case 'demo-off':if(!confirm('Retirer du site tous les costumes de démonstration (référence DEMO) ?'))return;LDC.arpc('loge_demo_retirer').then(function(n){A.costs={};toast(n+' costume'+(n>1?'s':'')+' de démonstration retiré'+(n>1?'s':''));return loadU();}).then(render).catch(oops);break;
  case 'import':importOpen();break;
  case 'im-prev':document.querySelectorAll('[data-map]').forEach(function(s){IM.map[s.dataset.map]=s.value===''?null:+s.value;});
    if(IM.map.nom==null){var ie=$('im-err');ie.textContent='Choisissez la colonne du nom du costume.';ie.hidden=false;return;}
    IM.out=importBuild();if(!IM.out.length){var ie2=$('im-err');ie2.textContent='Aucun costume trouvé avec ces colonnes.';ie2.hidden=false;return;}IM.step=3;importDraw();break;
  case 'im-back':IM.step=2;importDraw();break;
  case 'im-go':busy(b,true);var P=IM.out,done=0,stats={crees:0,maj:0},pg=$('im-prog');
    var labels={};P.forEach(function(c){labels[c.univers]=c.univers_label;});
    var chunks=[];for(var i=0;i<P.length;i+=250)chunks.push(P.slice(i,i+250));
    chunks.reduce(function(pr,ch){return pr.then(function(){return LDC.arpc('loge_import',{p_rows:ch}).then(function(s){stats.crees+=s.crees;stats.maj+=s.maj;done+=ch.length;pg.textContent='Import… '+done+' / '+P.length;});});},Promise.resolve())
    .then(function(){var mm=$('modal');if(mm)mm.remove();IM=null;A.costs={};toast(stats.crees+' créés, '+stats.maj+' mis à jour ✓');return loadU();}).then(render).catch(function(x){busy(b,false);oops(x);});break;
  case 'info-save':var g=function(id){return $(id).value.trim();},I=LDC.info();I.annonce=g('i-annonce');I.tel=g('i-tel');I.email=g('i-email');I.adresse=g('i-adresse');I.cp=g('i-cp');I.ville=g('i-ville');I.facebook=g('i-fb');I.horaires=LDC.DAYS.map(function(_,i){return g('i-h'+i);});
    busy(b,true);LDC.arpc('loge_enregistrer',{p_cle:'info',p_valeur:I}).then(function(){LDC.setContenu('info',I);busy(b,false);toast('Infos enregistrées – le site est à jour.');}).catch(function(x){busy(b,false);oops(x);});break;
  case 'pw-save':var pe=$('p-err'),nw=$('p-new').value;pe.hidden=true;var pf=function(x){pe.textContent=x;pe.hidden=false;};
    if(!$('p-old').value)return pf('Indiquez le mot de passe actuel.');if(nw.length<8)return pf('Le nouveau mot de passe doit faire 8 caractères minimum.');if(nw!==$('p-new2').value)return pf('Les deux nouveaux mots de passe ne sont pas identiques.');
    busy(b,true);LDC.arpc('loge_mdp_changer',{p_ancien:$('p-old').value,p_nouveau:nw}).then(function(ok){busy(b,false);if(!ok)return pf('Mot de passe actuel incorrect.');$('p-old').value=$('p-new').value=$('p-new2').value='';toast('Mot de passe changé ✓');}).catch(function(x){busy(b,false);oops(x);});break;
  case 'exppdf':var tt=document.title;document.title='Statistiques La Loge de Claire '+(A.annee==='tout'?'depuis le début':A.annee);toast('Choisissez « Enregistrer en PDF »');setTimeout(function(){window.print();document.title=tt;},400);break;
  case 'expxls':exportXlsx(b);break;
  case 'stats-refresh':A.ST=null;render();break;
  }
});
var qt=null;
document.addEventListener('input',function(e){
  if(e.target.id==='q'){A.q=e.target.value;clearTimeout(qt);var v=A.q.trim();qt=setTimeout(function(){if(v.length<2){A.qres=null;render();refocus();return;}LDC.arpc('loge_admin_costumes',{p_univers:null,p_q:v}).then(function(L){A.qres=L||[];render();refocus();}).catch(oops);},300);}
});
function refocus(){var q=$('q');if(q){q.focus();var n=q.value.length;q.setSelectionRange(n,n);}}
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='p-show')['p-old','p-new','p-new2'].forEach(function(id){$(id).type=t.checked?'text':'password';});
  if(t.dataset&&t.dataset.ldate){var g=A._G[+t.dataset.ldate];if(!t.value)return;locMaj(g.items.map(function(l){return l.id;}),{retour_prevu:t.value}).then(function(){toast('Date de retour modifiée');return loadL();}).then(render).catch(oops);}
  if(t.id==='e-ph'&&t.files[0]){editSync();$('e-phs').textContent='Envoi de la photo…';LDC.uploadPhoto(t.files[0]).then(function(p){CE.photo=p;editDraw();toast('Photo ajoutée');}).catch(function(x){console.warn(x);$('e-phs').textContent='La photo n’a pas pu être envoyée.';});}
  if(t.id==='im-f'&&t.files[0]){var f=t.files[0];$('im-s').textContent='Lecture du fichier…';
    needXlsx().then(function(){return f.arrayBuffer();}).then(function(buf){var wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''}).filter(function(r){return r.some(function(c){return String(c).trim();});});
      if(rows.length<2){$('im-s').textContent='Le fichier semble vide.';return;}
      IM={step:2,name:f.name,heads:rows[0].map(function(h){return String(h).trim();}),rows:rows.slice(1),map:{}};
      FIELDS.forEach(function(fd){IM.heads.forEach(function(h,i){if(IM.map[fd[0]]==null&&fd[2].test(h)&&!Object.keys(IM.map).some(function(k){return IM.map[k]===i;}))IM.map[fd[0]]=i;});});
      importDraw();}).catch(function(x){console.warn(x);$('im-s').textContent='Impossible de lire ce fichier (connexion ou format).';});}
  if(t.dataset&&t.dataset.map==='univers'){var w=$('im-defw');if(w)w.hidden=t.value!=='';}
});
render();start();
})();

</script>
