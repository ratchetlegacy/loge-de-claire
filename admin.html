<style>
:root{--red:#A8141C;--gold:#E3B23C;--ink:#1C1B1A;--brown:#3B2416;--brown2:#5A3B28;--cream:#FBF4E4;--line:#E8D9B5;--green:#2E6B3A;--orange:#9A4A00}
*{box-sizing:border-box}
body{margin:0;font-family:'Lato',system-ui,sans-serif;color:var(--brown);background:#F6F1E6;font-size:16px;line-height:1.5}
a{color:var(--red)}
button,input,select{font:inherit}
h1,h2{font-family:'Courgette',cursive;font-weight:400;margin:0;color:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:999px;border:0;font-weight:900;cursor:pointer;text-decoration:none}
.btn-red{background:var(--red);color:#fff}
.btn-line{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn-ghost{background:transparent;color:#fff;border:2px solid var(--gold)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
.field input,.field select{min-height:48px;border-radius:12px;border:1px solid #C9B58A;padding:0 14px;background:#fff;color:var(--brown)}

/* Login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--ink)}
.login form{width:100%;max-width:380px;background:var(--cream);border-radius:22px;padding:32px;display:flex;flex-direction:column;gap:14px;text-align:center;border:3px solid var(--gold)}
.login img{width:140px;height:140px;margin:0 auto;mix-blend-mode:multiply}
.login .hint{font-size:14px;color:var(--brown2);margin:0}

/* App */
header{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;border-bottom:4px solid var(--gold)}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px}
header .t{display:flex;align-items:center;gap:12px;margin:0}
header .t img{width:44px;height:44px;border-radius:50%;background:#fff}
header .t span{font-family:'Courgette',cursive;font-size:22px}
header .t small{display:block;font-family:'Lato',sans-serif;font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
header .acts{display:flex;gap:8px;flex-wrap:wrap}
header .btn{min-height:40px;padding:0 14px;font-size:14px}
.tabs{display:flex;gap:6px;margin:18px 0}
.tab{flex:1 1 0;min-height:48px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:900;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:#fff;border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.stat b{display:block;font-size:26px;color:var(--ink)}
.stat span{font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:flex-end}
.tools .field{flex:1 1 220px}
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:16px;border:1px solid var(--line);padding:14px}
.card-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.sw{width:48px;height:48px;border-radius:10px;flex:0 0 auto}
.card-h .n{flex:1 1 auto;min-width:0}
.card-h .n b{display:block;color:var(--ink)}
.card-h .n span{font-size:14px;color:var(--brown2)}
.pill{padding:3px 10px;border-radius:999px;color:#fff;font-size:13px;font-weight:900;white-space:nowrap}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;background:var(--cream)}
.row .s{flex:1 1 auto;font-weight:900;color:var(--ink)}
.row .c{min-width:70px;text-align:center;font-weight:900}
.row .c small{display:block;font-size:12px;font-weight:700;color:var(--brown2)}
.pm{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:#fff;color:var(--ink);font-size:22px;font-weight:900;cursor:pointer;line-height:1}
.pm:disabled{opacity:.35;cursor:not-allowed}
.back{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.back input{min-height:40px;border-radius:8px;border:1px solid #C9B58A;padding:0 10px}
.card-f{display:flex;justify-content:flex-end;margin-top:8px}
.del{min-height:40px;border:0;background:transparent;color:var(--red);font-weight:700;text-decoration:underline;cursor:pointer}
.add-form{background:#fff;border:2px solid var(--red);border-radius:16px;padding:16px;margin-bottom:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
.rdv{background:#fff;border-radius:16px;border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:6px}
.rdv .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rdv b{color:var(--ink);font-size:17px}
.rdv p{margin:0}
.rdv .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.empty{background:#fff;border-radius:16px;padding:24px;text-align:center;color:var(--brown2)}
.hide{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.shoot{background:#fff;border:2px dashed #C9B58A;border-radius:16px;padding:14px;margin-bottom:14px}
.shoot p{margin:0 0 10px}
.shoot-btns,.form-acts{display:flex;flex-wrap:wrap;gap:8px}
.add-form{display:flex;flex-direction:column;gap:14px;grid-template-columns:none}
.ph-zone{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.ph-zone img{width:120px;height:120px;object-fit:cover;border-radius:12px}
.lbl{font-weight:700;font-size:14px}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;padding:0 14px;border-radius:999px;border:2px solid #C9B58A;background:#fff;color:var(--ink);font-weight:700;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.sub{font-size:24px;margin:6px 0 10px}
.drafts{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;margin-bottom:12px}
.draft{flex:0 0 auto;width:110px;border:2px solid var(--red);border-radius:14px;background:#fff;padding:0;overflow:hidden;cursor:pointer;font-weight:900;color:var(--red)}
.draft .ph{display:block;height:100px}
.draft span:last-child{display:block;padding:6px 0}
button.sw{border:0;cursor:pointer;padding:0}
.btn.small{min-height:44px;padding:0 16px;font-size:14px}
.btn-del{background:#fff;color:var(--red);border:2px solid var(--red)}
.card-f{gap:8px;flex-wrap:wrap}
.sub-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.draft-box{flex:0 0 auto;display:flex;flex-direction:column;gap:4px}
.draft-del{min-height:44px;border:0;border-radius:10px;background:#FBEBEB;color:var(--red);font-weight:900;cursor:pointer}
.note{font-size:13px;color:var(--brown2);margin:16px 0 40px;text-align:center}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;background:var(--ink);color:#fff;border:2px solid var(--gold);border-radius:12px;padding:10px 16px;font-weight:700;display:none;max-width:calc(100% - 24px);text-align:center}
</style>
</head>

}
var stock=LDC.stock(),rdv=LDC.rdv(),real=stock.filter(function(m){return !m.draft;});

h+='<main class="wrap"><div class="tabs" role="tablist"><button class="tab" role="tab" type="button" data-tab="stock" aria-selected="'+(A.tab==='stock')+'">Costumes</button><button class="tab" role="tab" type="button" data-tab="rdv" aria-selected="'+(A.tab==='rdv')+'">Rendez-vous ('+pending+')</button></div>';
if(A.tab==='stock'){

h+='<button type="button" class="pm" data-out="'+m.id+'" data-i="'+i+'" aria-label="Louer un exemplaire, taille '+esc(s.s)+'"'+(s.f===0?' disabled':'')+'>−</button>';
h+='<span class="c">'+s.f+' / '+s.n+'<small>en loge</small></span>';
h+='<button type="button" class="pm" data-in="'+m.id+'" data-i="'+i+'" aria-label="Retour d’un exemplaire, taille '+esc(s.s)+'"'+(s.f>=s.n?' disabled':'')+'>+</button></div>';
});
h+='</div>';
if(f===0)h+='<div class="back"><label for="b-'+m.id+'">Retour prévu le</label><input id="b-'+m.id+'" type="text" data-back="'+m.id+'" placeholder="ex. 2 nov." value="'+esc(m.back||'')+'"></div>';
h+='<div class="card-f"><button type="button" class="btn btn-line small" data-edit="'+m.id+'">Modifier</button><button type="button" class="btn btn-del small" data-del="'+m.id+'">Supprimer le costume</button></div></div>';
});
h+='</div><p class="note">« − » quand un exemplaire part en location, « + » quand il revient. Le site se met à jour tout seul.</p>';
}else{
h+='<div class="cards">';
var list=rdv.slice().sort(function(a,b){return (a.key+a.slot)<(b.key+b.slot)?-1:1;});
if(!list.length)h+='<p class="empty">Aucun rendez-vous pour l’instant. Réservez un essayage depuis le site pour le voir apparaître ici.</p>';
list.forEach(function(r){
var col=r.status==='confirmé'?'var(--green)':(r.status==='annulé'?'#6B5744':'var(--orange)');
h+='<div class="rdv"><div class="top"><b>'+esc(r.day)+' · '+esc(r.slot)+'</b><span class="pill" style="background:'+col+'">'+esc(r.status)+'</span></div>';
h+='<p><strong>'+esc(r.name)+'</strong> – <a href="tel:'+esc(r.tel)+'">'+esc(r.tel)+'</a> – '+esc(r.nb)+' pers.</p>';
if(r.costumes)h+='<p>Costumes : '+esc(r.costumes)+'</p>';
if(r.note)h+='<p>Précisions : '+esc(r.note)+'</p>';
if(r.status!=='annulé')h+='<div class="acts">'+(r.status!=='confirmé'?'<button class="btn btn-red" type="button" data-conf="'+r.id+'">Confirmer et envoyer le SMS</button>':'<button class="btn btn-line" type="button" data-resms="'+r.id+'">Renvoyer le SMS</button>')+'<button class="btn btn-line" type="button" data-cancel="'+r.id+'">Annuler</button></div>';
h+='</div>';
});
h+='</div><p class="note">En version finale, Claire recevrait une notification à chaque nouvelle demande.</p>';
}
h+='<p class="note"><button class="del" type="button" data-act="reset">Remettre la démo à zéro</button></p></main>';
app.innerHTML=h;
}

var ADULT=['XS','S','M','L','XL','XXL','Taille unique'],KIDS=['2-4 ans','4-6 ans','6-8 ans','8-10 ans','10-12 ans'];
function photoStyle(m){var p=LDC.photo(m);return p?'background:#F6EEDC url('+p+') center/cover no-repeat':'background:'+m.bg;}
function newForm(){return {id:null,name:'',cat:'folles',photo:null,sizes:[]};}
function formHtml(){
var F=A.form,h='<form class="add-form" id="add"><div class="ph-zone">';
if(F.photo)h+='<img src="'+LDC.photo(F)+'" alt="Photo du costume">';
h+='<label class="btn btn-line" for="f-photo">'+(F.photo?'Changer la photo':'Prendre la photo')+'</label><input id="f-photo" class="hide" type="file" accept="image/*" capture="environment"></div>';
h+='<div class="field"><label for="a-name">Nom du costume</label><input id="a-name" type="text" value="'+esc(F.name)+'" placeholder="ex. Robe charleston dorée"></div>';
h+='<div class="field"><span class="lbl">Univers</span><div class="chipset">';
LDC.CATS.forEach(function(c){h+='<button type="button" class="opt" data-fcat="'+c.id+'" aria-pressed="'+(F.cat===c.id)+'">'+esc(c.label)+'</button>';});
h+='</div></div><div class="field"><span class="lbl">Tailles – touchez pour ajouter</span><div class="chipset">';
ADULT.concat(KIDS).forEach(function(s){var has=F.sizes.some(function(x){return x.s===s;});if(!has)h+='<button type="button" class="opt" data-addsize="'+esc(s)+'">+ '+esc(s)+'</button>';});
h+='</div>';
if(F.sizes.length){h+='<div class="rows" style="margin-top:8px">';F.sizes.forEach(function(x,i){h+='<div class="row"><span class="s">'+esc(x.s)+'</span><button type="button" class="pm" data-fminus="'+i+'" aria-label="Un exemplaire de moins, taille '+esc(x.s)+'">−</button><span class="c">'+x.n+'<small>exemplaire'+(x.n>1?'s':'')+'</small></span><button type="button" class="pm" data-fplus="'+i+'" aria-label="Un exemplaire de plus, taille '+esc(x.s)+'">+</button></div>';});h+='</div>';}
h+='</div><div class="form-acts"><button class="btn btn-red" type="submit">Enregistrer</button><button class="btn btn-line" type="button" data-act="cancel-form">Annuler</button>'+(F.id?'<button class="btn btn-del" type="button" data-del="'+F.id+'">Supprimer</button>':'')+'</div></form>';
return h;
}
function shrink(file,cb){
var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var max=640,w=img.width,h=img.height,k=Math.min(1,max/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.7));};img.src=r.result;};r.readAsDataURL(file);
}
function addDrafts(urls){
var s=LDC.stock();urls.forEach(function(u,i){s.unshift({id:Date.now()+i,draft:true,name:'',cat:'folles',bg:'#3B2416',photo:u,sizes:[]});});
LDC.saveStock(s);
if(JSON.stringify(LDC.stock()).length<JSON.stringify(s).length-10){toast('Mémoire de démo pleine : remettez la démo à zéro.');return;}
render();toast(urls.length>1?urls.length+' photos ajoutées – à compléter':'Photo ajoutée – vous pouvez enchaîner');
}
function openSms(r,kind){
var num=String(r.tel||'').replace(/[^0-9+]/g,'');
var txt=kind==='conf'
?'Bonjour '+r.name+', votre essayage à La Loge de Claire est confirmé le '+r.day+' à '+r.slot+'. À bientôt ! Claire – 06 38 43 08 44'
:'Bonjour '+r.name+', je suis désolée, je dois annuler votre essayage du '+r.day+' à '+r.slot+'. Rappelez-moi pour choisir un autre créneau. Claire – 06 38 43 08 44';
window.location.href='sms:'+num+'?&body='+encodeURIComponent(txt);
}
function upd(fn){var s=LDC.stock();fn(s);LDC.saveStock(s);render();}
function find(s,id){for(var i=0;i<s.length;i++){if(s[i].id===id)return s[i];}}
function updR(fn){var r=LDC.rdv();fn(r);LDC.saveRdv(r);render();}

document.addEventListener('submit',function(e){
e.preventDefault();
if(e.target.id==='login'){A.logged=true;try{sessionStorage.setItem('ldc-demo-login','1');}catch(x){}render();return;}
if(e.target.id==='add'){
var F=A.form;F.name=F.name.trim();
if(!F.name||!F.sizes.length){toast('Il manque le nom ou au moins une taille.');return;}
upd(function(s){
var m=F.id?find(s,F.id):null;
var sizes=F.sizes.map(function(x){var old=m&&m.sizes.filter(function(o){return o.s===x.s;})[0];var out=old?old.n-old.f:0;return {s:x.s,n:x.n,f:Math.max(0,x.n-out)};});
var data={name:F.name,cat:F.cat,bg:LDC.catBg(F.cat),photo:F.photo||undefined,sizes:sizes};
if(m){Object.keys(data).forEach(function(k){m[k]=data[k];});delete m.draft;}
else s.unshift(Object.assign({id:Date.now()},data));
});
A.adding=false;A.cat='all';A.q='';render();toast('Costume enregistré – il apparaît sur le site.');
}
});
document.addEventListener('click',function(e){
var b=e.target.closest('button');if(!b)return;
if(b.dataset.tab){A.tab=b.dataset.tab;render();return;}
if(b.dataset.edit){var em=find(LDC.stock(),+b.dataset.edit);A.form={id:em.id,name:em.name||'',cat:em.cat,photo:em.photo||null,sizes:em.sizes.map(function(x){return {s:x.s,n:x.n};})};A.adding=true;render();window.scrollTo(0,0);return;}
if(b.dataset.fcat){A.form.cat=b.dataset.fcat;render();return;}
if(b.dataset.addsize){A.form.sizes.push({s:b.dataset.addsize,n:1});render();return;}
if(b.dataset.fplus){A.form.sizes[+b.dataset.fplus].n++;render();return;}
if(b.dataset.fminus){var fi=+b.dataset.fminus;A.form.sizes[fi].n--;if(A.form.sizes[fi].n<=0)A.form.sizes.splice(fi,1);render();return;}
if(b.dataset.out){var id=+b.dataset.out,i=+b.dataset.i;upd(function(s){var m=find(s,id);if(m.sizes[i].f>0)m.sizes[i].f--;});return;}
if(b.dataset.in){var id2=+b.dataset.in,j=+b.dataset.i;upd(function(s){var m=find(s,id2);if(m.sizes[j].f<m.sizes[j].n)m.sizes[j].f++;if(LDC.free(m)>0)delete m.back;});return;}
if(b.dataset.del){
var id3=+b.dataset.del,dm=find(LDC.stock(),id3);if(!dm)return;
var q=dm.draft?'Supprimer cette photo en attente ?':'Supprimer « '+dm.name+' » ? Il disparaîtra aussi du site.';
if(confirm(q)){if(A.form&&A.form.id===id3)A.adding=false;upd(function(s){for(var k=0;k<s.length;k++){if(s[k].id===id3){s.splice(k,1);break;}}});toast(dm.draft?'Photo supprimée.':'Costume supprimé.');}
return;}
if(b.dataset.conf){var c=+b.dataset.conf,rc=null;updR(function(r){r.forEach(function(x){if(x.id===c){x.status='confirmé';rc=x;}});});if(rc)openSms(rc,'conf');return;}
if(b.dataset.resms){var rs=LDC.rdv().filter(function(x){return x.id===+b.dataset.resms;})[0];if(rs)openSms(rs,'conf');return;}
if(b.dataset.cancel){var d=+b.dataset.cancel,rx=null;if(!confirm('Annuler ce rendez-vous ? Un SMS d\u2019annulation sera préparé pour le client.'))return;updR(function(r){r.forEach(function(x){if(x.id===d){x.status='annulé';rx=x;}});});if(rx)openSms(rx,'cancel');return;}
switch(b.dataset.act){
case 'toggle-add':A.adding=!A.adding;if(A.adding)A.form=newForm();render();break;
case 'cancel-form':A.adding=false;render();break;
case 'del-drafts':if(confirm('Supprimer toutes les photos en attente ?')){upd(function(s){for(var k=s.length-1;k>=0;k--){if(s[k].draft)s.splice(k,1);}});toast('Photos en attente supprimées.');}break;
case 'logout':A.logged=false;try{sessionStorage.removeItem('ldc-demo-login');}catch(x){}render();break;
case 'reset':if(confirm('Remettre les costumes et rendez-vous de démonstration à zéro ?')){LDC.reset();render();toast('Démo réinitialisée.');}break;
}
});
document.addEventListener('input',function(e){
if(e.target.id==='a-name'){A.form.name=e.target.value;return;}
if(e.target.id==='q'){A.q=e.target.value;var pos=e.target.selectionStart;render();var q=document.getElementById('q');q.focus();q.setSelectionRange(pos,pos);}
});
document.addEventListener('change',function(e){
var fl=e.target.files;
if(e.target.id==='f-photo'&&fl&&fl[0]){shrink(fl[0],function(u){A.form.photo=u;render();});return;}
if((e.target.id==='cam'||e.target.id==='gal')&&fl&&fl.length){var arr=[].slice.call(fl,0,30),out=[];arr.forEach(function(f,i){shrink(f,function(u){out[i]=u;if(out.filter(Boolean).length===arr.length)addDrafts(out);});});e.target.value='';return;}
if(e.target.id==='fcat'){A.cat=e.target.value;render();}
if(e.target.dataset.back){var id=+e.target.dataset.back,v=e.target.value.trim();var s=LDC.stock(),m=find(s,id);if(v)m.back=v;else delete m.back;LDC.saveStock(s);toast('Date de retour enregistrée.');}
});
window.addEventListener('storage',render);
render();
})();
</script>
</body>
</html>
